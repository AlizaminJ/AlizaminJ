name: Update activity graph

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-activity-graph
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Generate SVG from public contribution data
        env:
          GRAPH_TOKEN: ${{ secrets.GRAPH_TOKEN }}
        run: node .github/scripts/generate-activity-graph.mjs

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity-graph.svg
          if git diff --cached --quiet; then
            echo "Activity graph is already up to date."
            exit 0
          fi
          git commit -m "chore: update activity graph"
          git push